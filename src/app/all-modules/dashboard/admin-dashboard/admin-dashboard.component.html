<!-- Page Content -->
<div class="content container-fluid">

    <!-- Page Header -->
    <div class="page-header">
        <div class="row">
            <div class="col-sm-12">
                <h3 class="page-title">Welcome Admin!</h3>
                <ul class="breadcrumb">
                    <li class="breadcrumb-item active">Dashboard</li>
                </ul>
            </div>
        </div>
    </div>
    <!-- /Page Header -->

    <div class="row">
        <div class="col-md-6 col-sm-6 col-lg-6 col-xl-3">
            <div class="card dash-widget">
                <div class="card-body">
                    <span class="dash-widget-icon"><i class="fa fa-check-square"></i></span>
                    <div class="dash-widget-info">
                        <h3>112</h3>
                        <span>Completed</span>
                        <span> Calls</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-sm-6 col-lg-6 col-xl-3">
            <div class="card dash-widget">
                <div class="card-body">
                    <span class="dash-widget-icon"><i class="fa fa-bullseye"></i></span>
                    <div class="dash-widget-info">
                        <h3>44</h3>
                        <span>Solved Responses</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-sm-6 col-lg-6 col-xl-3">
            <div class="card dash-widget">
                <div class="card-body">
                    <span class="dash-widget-icon"><i class="fa fa-bell"></i></span>
                    <div class="dash-widget-info">
                        <h3>37</h3>
                        <span>Calls in the Queue</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-sm-6 col-lg-6 col-xl-3">
            <div class="card dash-widget">
                <div class="card-body">
                    <span class="dash-widget-icon"><i class="fa fa-paper-plane"></i></span>
                    <div class="dash-widget-info">
                        <h3>218</h3>
                        <span>Response Pending</span>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="row">
        <div class="col-md-12">
            <div class="row">
                <div class="col-md-6 text-center">
                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title">Calls Received</h3>
                            <div mk-morris-js [options]="chartOptions" [data]="chartData" type="Bar">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 text-center">
                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title">Nibedon Details</h3>
                            <div mk-morris-js [options]="chartOptions1" [data]="chartData1" type="Bar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<!-- /Page Content -->
