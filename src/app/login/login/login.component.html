<div class="account-content">

    <div class="container">



        <div class="account-box">
            <div class="account-wrapper">
                <h3 class="account-title">Login</h3>
                <p class="account-subtitle">Access to Satcom Portal</p>

                <!-- Account Form -->
                <form>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input class="form-control" type="text">
                    </div>
                    <div class="form-group">
                        <div class="row">
                            <div class="col">
                                <label>Password</label>
                            </div>
                            <div class="col-auto">
                                <a class="text-muted" routerLink = "/login/forgot">
                                    Forgot password?
                                </a>
                            </div>
                        </div>
                        <input class="form-control" type="password">
                    </div>
                    <div class="form-group text-center">
                        <button class="btn btn-primary account-btn" type="button" [routerLink]="['/dashboard/admin']">Login</button>
                    </div>
                    <div class="account-footer">
                        <p>Don't have an account yet? <a routerLink = "/login/register">Register</a></p>
                    </div>
                </form>
                <!-- /Account Form -->

            </div>
        </div>
    </div>
</div>
